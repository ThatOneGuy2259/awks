name: Deploy to Production

on:
  push:
    branches: [main]

# Runs on the self-hosted runner installed on the home server (100.94.134.21).
# The runner executes locally on the box, so no SSH hop or tunnel is needed.
jobs:
  deploy:
    runs-on: [self-hosted, awks-server]
    concurrency:
      group: awks-deploy
      cancel-in-progress: false
    steps:
      - name: Pull latest main
        run: |
          cd "$HOME/awks"
          git fetch origin main
          git reset --hard origin/main

      # Keep yt-dlp current — YouTube's anti-bot changes break older versions.
      # Non-fatal: a failed self-update must never block a deploy.
      - name: Update yt-dlp
        run: sudo yt-dlp -U || true

      # Tempo detection at ingest needs the aubio CLI. Idempotent — apt is a
      # no-op once it's installed. Non-fatal so it never blocks a deploy.
      - name: Ensure aubio-tools
        run: command -v aubio >/dev/null 2>&1 || sudo apt-get install -y aubio-tools || true

      - name: Build frontend + backend
        run: |
          cd "$HOME/awks"
          ./deploy.sh --rebuild --build-only

      - name: Restart service
        run: sudo systemctl restart awks

      - name: Health check
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 2 http://localhost:8090/ >/dev/null
          echo "Deploy OK"
